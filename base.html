<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Kunsi Premier League (KPL 2026) — Official Tournament Portal, Player Auction & Live Bidding">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kunsi Premier League (KPL 2026)">
  <meta property="og:description" content="Official Live Auction, Player Registration & Team Squads for Kunsi Premier League (KPL 2026)">
  <meta property="og:site_name" content="Kunsi Premier League (KPL 2026)">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Kunsi Premier League (KPL 2026)">
  <meta name="twitter:description" content="Official Live Auction, Player Registration & Team Squads for Kunsi Premier League (KPL 2026)">
  <title>{% block title %}{{ tournament_name or 'Kunsi Premier League (KPL 2026)' }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* Embed mode (iframe inside Admin) */
    {% if request.args.get('embed') %}
    .navbar, footer { display: none !important; }
    body { background: transparent !important; padding: 0 !important; margin: 0 !important; }
    .page-container { padding: 0.5rem 0.25rem !important; max-width: 100% !important; margin: 0 !important; }
    {% endif %}
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- ── Sticky Navbar ───────────────────────────────────── -->
  <header class="navbar">
    <div class="nav-container">

      <!-- Brand -->
      <a href="/" class="nav-brand" aria-label="KPL 2026 Home">
        <span class="brand-badge">🏏 KPL</span>
        <span style="font-size:0.92rem; font-weight:800; color:#fff; line-height:1.2;">
          Kunsi Premier League
          <span style="display:block; font-size:0.7rem; font-weight:600; color:#94a3b8; letter-spacing:0.04em;">Season 2026</span>
        </span>
      </a>

      <!-- Mobile Toggle -->
      <button class="mobile-toggle" id="mobileNavToggle" onclick="toggleMobileNav()" aria-label="Menu" aria-expanded="false">
        <span id="menuIcon">☰</span>
      </button>

      <!-- Nav Links -->
      <ul class="nav-links" id="navLinks" role="navigation">
        <li>
          <a href="/" id="nav-home" class="nav-link {% if active_page == 'home' %}active{% endif %}" aria-label="Home">
            🏠 <span>Home</span>
          </a>
        </li>
        <li>
          <a href="/admin" id="nav-admin" class="nav-link tab-admin {% if active_page == 'admin' %}active{% endif %}" aria-label="Admin Console">
            ⚙️ <span>Admin</span>
          </a>
        </li>
        <li>
          <a href="/register" id="nav-register" class="nav-link tab-reg {% if active_page == 'register' %}active{% endif %}" aria-label="Player Registration">
            📝 <span>Register</span>
          </a>
        </li>
        <li>
          <a href="/view" id="nav-viewers" class="nav-link tab-viewers {% if active_page == 'view' %}active{% endif %}" aria-label="Live Auction Viewers" title="Mobile Live Auction Stream">
            <span class="live-pulse-dot" aria-hidden="true"></span>
            <span>🔴 Live</span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <!-- ── Page Content ────────────────────────────────────── -->
  <main class="page-container" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ──────────────────────────────────────────── -->
  <footer>
    <p style="color: #475569; font-size: 0.8rem;">
      🏏 <strong style="color: #64748b;">Kunsi Premier League (KPL 2026)</strong> &copy; 2026
      &nbsp;·&nbsp; Official Tournament Portal &amp; Live Auction System
    </p>
  </footer>

  <!-- ── Mobile Nav Script ───────────────────────────────── -->
  <script>
    function toggleMobileNav() {
      const nav = document.getElementById('navLinks');
      const toggle = document.getElementById('mobileNavToggle');
      const icon = document.getElementById('menuIcon');
      const isOpen = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
      icon.textContent = isOpen ? '✕' : '☰';
    }

    // Close on outside click
    document.addEventListener('click', function(e) {
      const nav = document.getElementById('navLinks');
      const toggle = document.getElementById('mobileNavToggle');
      if (nav.classList.contains('open') && !nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove('open');
        document.getElementById('menuIcon').textContent = '☰';
        toggle.setAttribute('aria-expanded', false);
      }
    });

    // Close on nav link click (mobile)
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('menuIcon').textContent = '☰';
      });
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
